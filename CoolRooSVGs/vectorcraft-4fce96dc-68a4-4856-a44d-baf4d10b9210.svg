<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1a0d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="codeRain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF41;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00FF41;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="furGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A97142;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="coatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2b2b2b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="gloveGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradient)" />

  <!-- Matrix Code Rain Effect -->
  <g font-family="monospace" font-weight="bold" font-size="14" fill="#00FF41" opacity="0.4">
    <text x="20" y="0" transform="translate(0, 50)">1 0 1 0</text>
    <text x="20" y="40" transform="translate(0, 50)">0 1 A 4</text>
    <text x="20" y="80" transform="translate(0, 50)">X 0 1 F</text>
    
    <text x="100" y="10">0 1 0</text>
    <text x="100" y="50">1 Z 1</text>
    <text x="100" y="90">0 0 7</text>
    <text x="100" y="130">1 1 0</text>

    <text x="450" y="20">1 0</text>
    <text x="450" y="60">F F</text>
    <text x="450" y="100">0 1</text>
    
    <text x="300" y="300">E R R</text>
    <text x="300" y="340">0 1 0</text>
    
    <text x="50" y="400">N U L</text>
    <text x="50" y="440">1 1 1</text>
  </g>

  <!-- Comic Impact Burst -->
  <path d="M380 250 L410 200 L430 240 L480 220 L460 270 L500 300 L450 320 L440 370 L400 330 L350 350 L370 300 L320 280 Z" fill="#FFD700" stroke="#FF4500" stroke-width="3" />

  <!-- The Bug (Glitchy Beetle) -->
  <g transform="translate(400, 280) rotate(15)">
    <path d="M-30 -40 Q0 -60 30 -40 L20 40 Q0 60 -20 40 Z" fill="#222" stroke="#00FF41" stroke-width="2" />
    <path d="M-30 -20 L-50 -30 M-30 0 L-55 0 M-25 20 L-50 30" stroke="#00FF41" stroke-width="2" fill="none" />
    <path d="M30 -20 L50 -30 M30 0 L55 0 M25 20 L50 30" stroke="#00FF41" stroke-width="2" fill="none" />
    <circle cx="-10" cy="-30" r="5" fill="#F00" />
    <circle cx="10" cy="-30" r="5" fill="#F00" />
    <!-- Glitch rectangles -->
    <rect x="-40" y="-10" width="80" height="5" fill="#00FF41" opacity="0.6" />
    <rect x="-35" y="10" width="60" height="3" fill="#00FF41" opacity="0.6" />
  </g>

  <!-- Kangaroo Neo -->
  <g transform="translate(0, 20)">
    <!-- Coat Tails (Back) -->
    <path d="M150 300 Q100 400 50 480 L200 480 L220 350 Z" fill="#111" />
    <path d="M300 300 Q350 400 400 480 L250 480 L280 350 Z" fill="#111" />

    <!-- Body/Torso -->
    <path d="M180 200 L320 200 L300 400 L200 400 Z" fill="url(#coatGradient)" stroke="#000" stroke-width="2"/>
    
    <!-- Coat Collar -->
    <path d="M180 200 L170 150 L220 180 M320 200 L330 150 L280 180" stroke="#000" stroke-width="3" fill="#1a1a1a" />

    <!-- Head -->
    <g transform="translate(250, 140)">
      <!-- Ears -->
      <path d="M-40 -30 L-60 -90 L-20 -50 Z" fill="url(#furGradient)" stroke="#000" stroke-width="2"/>
      <path d="M40 -30 L60 -90 L20 -50 Z" fill="url(#furGradient)" stroke="#000" stroke-width="2"/>
      
      <!-- Face Shape -->
      <path d="M-45 -30 Q-50 20 -20 50 L0 55 L20 50 Q50 20 45 -30 Q0 -50 -45 -30 Z" fill="url(#furGradient)" stroke="#000" stroke-width="2"/>
      
      <!-- Snout -->
      <ellipse cx="0" cy="35" rx="15" ry="10" fill="#8B5A2B" />
      <path d="M-5 32 L5 32 L0 40 Z" fill="#000" /> <!-- Nose -->
      
      <!-- Mouth -->
      <path d="M-10 45 Q0 50 10 45" stroke="#000" stroke-width="2" fill="none" />

      <!-- Sunglasses (Neo Style) -->
      <g>
        <path d="M-42 -5 Q-20 -5 -5 0 Q-20 15 -40 10 Z" fill="url(#lensGradient)" stroke="#000" stroke-width="1"/>
        <path d="M42 -5 Q20 -5 5 0 Q20 15 40 10 Z" fill="url(#lensGradient)" stroke="#000" stroke-width="1"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#000" stroke-width="2" />
        <!-- Matrix Reflection in glasses -->
        <text x="-30" y="5" font-family="monospace" font-size="6" fill="#00FF41" opacity="0.8">10</text>
        <text x="20" y="5" font-family="monospace" font-size="6" fill="#00FF41" opacity="0.8">01</text>
      </g>
    </g>

    <!-- Left Arm (Guarding) -->
    <path d="M180 220 Q140 250 160 300" stroke="url(#furGradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <!-- Left Glove -->
    <circle cx="170" cy="280" r="35" fill="url(#gloveGradient)" stroke="#000" stroke-width="3" />
    <path d="M150 270 Q170 260 190 270" stroke="#600" stroke-width="3" fill="none" opacity="0.5"/>

    <!-- Right Arm (Punching) -->
    <path d="M320 220 Q350 230 380 260" stroke="url(#furGradient)" stroke-width="25" fill="none" stroke-linecap="round"/>
    <!-- Right Glove (Hitting the bug) -->
    <g transform="translate(390, 270)">
      <ellipse cx="0" cy="0" rx="45" ry="35" fill="url(#gloveGradient)" stroke="#000" stroke-width="3" />
      <path d="M-20 -10 Q0 -20 20 -10" stroke="#600" stroke-width="3" fill="none" opacity="0.5"/>
      <!-- Motion lines -->
      <path d="M-60 -20 L-40 -15 M-60 0 L-40 0 M-60 20 L-40 15" stroke="#FFF" stroke-width="2" />
    </g>
  </g>

  <!-- Top Text -->
  <g filter="url(#glow)">
    <text x="256" y="80" text-anchor="middle" font-family="Impact, sans-serif" font-size="72" fill="#00FF41" stroke="#FFF" stroke-width="2" letter-spacing="2">ROO CODE</text>
  </g>
  
  <!-- Comic Style Border -->
  <rect x="5" y="5" width="502" height="502" fill="none" stroke="#00FF41" stroke-width="4" rx="10" />

</svg>